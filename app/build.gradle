plugins {
    id 'com.android.application'
}
android {
    namespace 'com.soagent.app'
    compileSdk 33
    defaultConfig {
        applicationId "com.soagent.app"
        minSdk 24
        targetSdk 29
        versionCode 3
        versionName "3.0-miui-fix"
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
